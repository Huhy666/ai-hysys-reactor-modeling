[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-hysys-web"
version = "0.1.0"
description = "Natural-language Web controller for Aspen HYSYS reactor modeling"
requires-python = ">=3.11,<3.13"
dependencies = [
  "anyio>=4.0",
  "fastapi>=0.115",
  "httpx>=0.27",
  "openai>=1.60",
  "pydantic-settings>=2.7",
  "python-dotenv>=1.0",
  "pywin32>=308; platform_system == 'Windows'",
  "pywinauto>=0.6.9; platform_system == 'Windows'",
  "uvicorn>=0.34",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.9",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "hysys: requires Aspen HYSYS V15 and a valid local license",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

